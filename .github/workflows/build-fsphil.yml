name: Build fsphil HackTV (Codeberg)

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4
        
      - name: Restore last built commit SHA
        id: cache-sha
        uses: actions/cache@v3
        with:
          path: .last_built_sha
          key: hacktv-fsphil-sha

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools git make libtool cmake yasm nasm patch dpkg-dev

      - name: Clone Codeberg repo
        run: git clone https://codeberg.org/fsphil/hacktv.git

      - name: Get latest commit SHA
        id: get-sha
        run: |
          CID=$(git -C hacktv rev-parse HEAD)
          echo "cid=$CID" >> $GITHUB_OUTPUT

      - name: Check if build is needed
        id: check
        run: |
          if [ -f .last_built_sha ] && [ "$(cat .last_built_sha)" = "${{ steps.get-sha.outputs.cid }}" ]; then
            echo "No new commit — skipping build."
            exit 0
          fi

      - name: Build & package
        if: success()   # only runs if not skipped
        run: ./build_and_package.sh hacktv dist

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hacktv-fsphil
          path: dist/*.zip

      - name: Save latest commit SHA
        if: success()
        run: echo "${{ steps.get-sha.outputs.cid }}" > .last_built_sha
